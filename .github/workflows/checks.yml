# Runs on every pull request, so nothing is merged unless the engine still matches the V1 workbook, the server still
# gives the engine's numbers on the files, on SQLite and on PostgreSQL, and the move from files to a database gives
# exactly the same answers, and every page of the front end opens in a browser. It deploys nothing, and never touches
# the live database.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:                         # a throwaway PostgreSQL 16, the version of the Azure database
        image: postgres:16
        env:
          POSTGRES_PASSWORD: checks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RIGHTPRICE_TEST_DATABASE_URL: postgresql://postgres:checks@localhost:5432/postgres
      RIGHTPRICE_CHECK_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Engine matches the V1 workbook
        run: python check_engine.py
      - name: Server gives the engine's numbers on files, SQLite and PostgreSQL; the move to a database changes nothing
        run: python check_server.py
      - name: Front end script parses
        run: for f in web/rightcost.js web/access.js web/dated.js web/purchases.js web/pages/*.js; do node --check "$f" || exit 1; done
      - name: A browser for the screen checks (not needed by the app itself)
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Every page opens in a browser, light and dark and at phone width, and the main paths work
        run: python check_browser.py
